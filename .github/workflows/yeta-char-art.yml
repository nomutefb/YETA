name: yeta-char-art

# 무음동 10인 판타지 캐릭터 초상(운영자 260707 "이거 기틀로 캐릭터 이미지 하나씩 · 판타지컬하게 · 완성형 만들고 편집").
# ⚠️ OpenAI 유료 종량제 = 수동 dispatch 전용(자동 트리거 금지 · 이미지 파이프 공통 규약).
# 산출 = viewer/assets/yeta_char/<id>.png(+webp) 을 main에 직접 커밋(git 정본 · 편집 베이스 · roster 자동주입 안 함).
on:
  workflow_dispatch:
    inputs:
      force:
        description: '1 = 기존 것도 재생성'
        required: false
        default: ''
      only:
        description: '특정 id 하나만(예: mudi · 비용절감 테스트)'
        required: false
        default: ''
      avmode:
        description: '1 = 얼빡 프사만(큰 초상 무시 · 1:1 극단 클로즈업 → av/<id>.webp + roster 배선)'
        required: false
        default: ''
      rebuild:
        description: '1 = 생성 없이 기존 원본에서 확대 크롭만 다시(무과금 · avmode=1과 함께)'
        required: false
        default: ''
      zoom:
        description: '얼빡 확대 배율(기본 0.72 · 작을수록 더 확대)'
        required: false
        default: ''
      takes:
        description: '얼빡 여벌 테이크 수(기본 1 · 최대 6 · 2장째부터 av/<id>_v2.webp… 로만 떨어지고 roster 미주입)'
        required: false
        default: ''

concurrency:
  group: yeta-char-art
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  charart:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: ffmpeg (webp·av 변환 — 러너 기본 이미지에 없음 · 260721 실측 계승)
        run: timeout 180 sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1 || echo "설치 실패/시간초과 — ffmpeg 미설치 — png 원본 폴백(av 배선 생략)"

      - name: 판타지 캐릭터 초상 생성
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_KEY_nomute: ${{ secrets.OPENAI_API_KEY_nomute }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL }}
          FORCE: ${{ inputs.force }}
          YETA_CHAR_ONLY: ${{ inputs.only }}
          YETA_AV_MODE: ${{ inputs.avmode }}   # 1 = 얼빡 프사 축(운영자 260725)
          YETA_AV_REBUILD: ${{ inputs.rebuild }}   # 1 = 크롭만 다시(무과금)
          YETA_AV_ZOOM: ${{ inputs.zoom }}
          YETA_AV_TAKES: ${{ inputs.takes }}   # N장 여벌(운영자 260726 "지피티로 한 4장")
        run: python3 .github/scripts/yeta_char_art.py

      - name: 커밋 (신규 있을 때만)
        run: |
          # 산출은 **디스패치한 그 ref**로(260811 · yeta-map-bg.yml 395차 수정 계승 — yeta-bg-var run#7에서 같은 하드코딩으로 유료 산출이 증발했다).
          BR="${GITHUB_REF_NAME}"
          git config user.name "yeta-char-art[bot]"
          git config user.email "actions@users.noreply.github.com"
          # pathspec 분리 필수(한 add에 없는 경로 섞이면 전체 무스테이징 — yeta-face 전례). av/ = yeta_char/ 하위라 포함.
          git add viewer/assets/yeta_char/ 2>/dev/null || true
          git add apps/yeta/characters/roster.json 2>/dev/null || true
          git diff --cached --quiet && { echo "신규 없음 — 커밋 생략"; exit 0; }
          git commit -m "무음동 캐릭터 초상 생성 + 작은얼굴(av) 크롭 + roster avatar 자동주입 — yeta-char-art dispatch (${BR})"
          # 장시간 런 중 브랜치 전진 대비 — pull --rebase 후 push 재시도(신규 파일뿐이라 충돌 없음)
          for i in 1 2 3 4 5; do
            git pull --rebase origin "$BR" && git push origin "HEAD:$BR" && exit 0
            git rebase --abort 2>/dev/null || true   # ⚠ 없으면 1회차 충돌이 워크트리에 unmerged 를 남겨 2~5회차가 착수도 못 하고 같은 이유로 죽는다(run#7 "5회 전부 unmerged files" 실측) · 정본 = yeta-char-board.yml
            echo "push 재시도 ${i}/5 …"; sleep $((i*5))
          done
          echo "::error::push 5회 실패 — ${BR} 전진 과다"; exit 1

      # ⚠️ 260812 평의회 — 커밋이 실패하면 **이미 과금된 산출물이 러너와 함께 사라진다**(run#7 실측).
      #    push 전패든 취소든 여기서 한 벌 건져 두면 운영자가 받아 수동 커밋할 수 있다. 정본 = yeta-char-board.yml.
      #    조건에 cancelled() 를 포함하는 건 yeta-chat.yml 실측 계승 — 취소·잡 타임아웃은 failure()가 false라 백업이 조용히 스킵된다.
      - name: 실패 시 산출물 보존 (과금분 소실 방지)
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: yeta-char-art-out
          path: viewer/assets/yeta_char/
          retention-days: 7
          if-no-files-found: ignore
