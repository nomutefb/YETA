name: yeta-bg-var

# 무음동 배경 배리에이션(운영자 260707 "openai 프롬프팅 — 날씨·분위기·시간대·편의점 등 다양하게").
# ⚠️ OpenAI 유료 종량제 = 수동 dispatch 전용(자동 트리거 금지 · 이미지 파이프 공통 규약).
# 산출 = viewer/assets/yeta_bg/var_*.png 을 main에 직접 커밋(git 정본 · yeta_face git 폴백 결).
on:
  workflow_dispatch:
    inputs:
      force:
        description: '1 = 기존 것도 재생성'
        required: false
        default: ''

concurrency:
  group: yeta-bg-var
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bgvar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # ⚠️ 260726 실측: 이 스텝이 없어서 mudi 3씬이 png만 커밋되고 webp가 조용히 생략됐다(뷰어는 .webp만 참조 = 그대로면 안 보임).
      # yeta-char-art.yml의 동일 스텝 계승 — bg_var.webp()가 shutil.which("ffmpeg") 없으면 비치명 스킵이라 실패 신호도 안 뜬다.
      - name: ffmpeg (webp 사본 변환 — 러너 기본 이미지에 없음)
        run: sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1 || echo "ffmpeg 미설치 — png 원본만(뷰어 참조 불가 · 수동 변환 필요)"

      - name: 배경 배리에이션 생성
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_KEY_nomute: ${{ secrets.OPENAI_API_KEY_nomute }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL }}
          FORCE: ${{ inputs.force }}
        run: python3 .github/scripts/yeta_bg_var.py

      - name: 커밋 (신규 있을 때만)
        run: |
          git config user.name "yeta-bg-var[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add viewer/assets/yeta_bg/ 2>/dev/null || true
          git diff --cached --quiet && { echo "신규 없음 — 커밋 생략"; exit 0; }
          git commit -m "무음동 배경 배리에이션 생성 — yeta-bg-var 수동 dispatch"
          # 장시간 런 중 main 전진 대비 — pull --rebase 후 push 재시도(run#2 rejected 재발 방지 · 신규 파일뿐이라 충돌 없음)
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "push 재시도 ${i}/5 …"; sleep $((i*5))
          done
          echo "::error::push 5회 실패 — main 전진 과다"; exit 1
